---
# Homepage widgets are fetched SERVER-side by the container on ctl01, so every
# URL must be reachable from the lab VLAN. Proxmox is a bookmark for that
# reason: bookmarks resolve in the browser, which is on the management network
# the lab deliberately cannot reach.

- Overview:
    - Minecraft server:
        icon: mdi-minecraft
        href: http://192.168.193.100:8080
        description: Paper 1.21.8 · live world map
        widget:
          type: minecraft
          url: udp://192.168.193.100:25565
    - Fleet · 1h:
        icon: mdi-robot
        description: what the bots attempted
        widget:
          type: customapi
          url: http://192.168.193.30:9200/mcai-skill-agents/_search
          method: POST
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          refreshInterval: 30000
          headers:
            Content-Type: application/json
          requestBody: {"size": 0, "query": {"range": {"@timestamp": {"gte": "now-1h"}}}, "aggs": {"ok": {"filter": {"term": {"skill.status": "success"}}}, "moved": {"sum": {"field": "skill.distance_moved"}}}}
          mappings:
            - field: hits.total.value
              label: actions
              format: number
            - field: aggregations.ok.doc_count
              label: succeeded
              format: number
            - field: aggregations.moved.value
              label: blocks
              format: number
    - Deaths · 1h:
        icon: mdi-skull
        description: the number that had no dashboard
        widget:
          type: customapi
          url: http://192.168.193.30:9200/mcai-skill-agents/_search
          method: POST
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          refreshInterval: 30000
          headers:
            Content-Type: application/json
          requestBody: {"size": 0, "query": {"bool": {"must": [{"term": {"skill.name": "_death"}}, {"range": {"@timestamp": {"gte": "now-1h"}}}]}}, "aggs": {"falls": {"filter": {"term": {"skill.fail_class": "fall"}}}}}
          mappings:
            - field: hits.total.value
              label: deaths
              format: number
            - field: aggregations.falls.doc_count
              label: falls
              format: number

# 'moved' is the stuck detector: measured displacement, not a claim. A bot can
# report success every minute while standing still -- that state went unnoticed
# for sixteen hours, and this row is what makes it visible at a glance.
- Bots:
    - Scout01:
        href: http://192.168.193.40:3007
        description: live 3D view · click to watch
        widget:
          type: customapi
          url: http://192.168.193.30:9200/mcai-skill-agents/_search
          method: POST
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          refreshInterval: 30000
          headers:
            Content-Type: application/json
          requestBody: {"size": 0, "query": {"bool": {"must": [{"term": {"bot.name": "Scout01"}}, {"range": {"@timestamp": {"gte": "now-1h"}}}]}}, "aggs": {"lastmove": {"filter": {"range": {"skill.distance_moved": {"gt": 0}}}, "aggs": {"t": {"max": {"field": "@timestamp"}}}}, "ok": {"filter": {"term": {"skill.status": "success"}}}, "top": {"terms": {"field": "skill.name", "size": 1, "exclude": "_.*"}}, "moved": {"sum": {"field": "skill.distance_moved"}}}}
          mappings:
            - field: aggregations.lastmove.t.value_as_string
              label: moved
              format: relativeDate
            - field: aggregations.top.buckets.0.key
              label: doing
            - field: hits.total.value
              label: acts
              format: number
            - field: aggregations.ok.doc_count
              label: ok
              format: number
            - field: aggregations.moved.value
              label: blocks
              format: number
