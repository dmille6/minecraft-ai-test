        widget: { type: glances, url: http://192.168.193.100:61208, version: 4, metric: info }
    - lab01 · Bot fleet:
        widget: { type: glances, url: http://192.168.193.40:61208, version: 4, metric: info }
    - evd01 · Evidence:
        widget: { type: glances, url: http://192.168.193.21:61208, version: 4, metric: info }
    - elk01 · ELK:
        widget: { type: glances, url: http://192.168.193.30:61208, version: 4, metric: info }
    - ctl01 · Control:
        widget: { type: glances, url: http://192.168.193.10:61208, version: 4, metric: info }

- Storage:
    - lab01:
        widget: { type: glances, url: http://192.168.193.40:61208, version: 4, metric: fs }
    - evd01:
        widget: { type: glances, url: http://192.168.193.21:61208, version: 4, metric: fs }
    - elk01:
        widget: { type: glances, url: http://192.168.193.30:61208, version: 4, metric: fs }

- Services:
    - Kibana:
        href: http://192.168.193.30:5601
        description: dashboards · bot telemetry
        siteMonitor: http://192.168.193.30:5601
    - Elasticsearch:
        description: cluster health
        widget:
          type: customapi
          url: http://192.168.193.30:9200/_cluster/health
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          mappings:
            - field: status
              label: status
            - field: active_shards
              label: shards
              format: number
