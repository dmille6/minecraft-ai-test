---
# Widgets are fetched SERVER-side by the Homepage container on ctl01, so every
# URL here must be reachable from the lab VLAN. That is why Proxmox appears only
# as a bookmark: bookmarks resolve in the browser, which sits on the management
# network the lab deliberately cannot reach.

- The lab:
    - Minecraft server:
        href: http://mc01:5601
        description: Paper 1.21.8 · seed 7914455308567851796
        widget:
          type: minecraft
          url: udp://192.168.193.100:25565
    - Fleet decisions · 1h:
        description: LLM calls the bots actually completed
        widget:
          type: customapi
          url: http://192.168.193.30:9200/mcai-llm-agents/_search
          method: POST
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          headers:
            Content-Type: application/json
          requestBody:
            size: 0
            query: { range: { "@timestamp": { gte: now-1h } } }
            aggs:
              valid: { filter: { term: { "llm.schema_valid": true } } }
              latency: { avg: { field: llm.latency_ms } }
          mappings:
            - field: hits.total.value
              label: decisions
              format: number
            - field: aggregations.valid.doc_count
              label: schema-valid
              format: number
            - field: aggregations.latency.value
              label: avg ms
              format: number
    - Deaths · 1h:
        # The number that mattered most and was never on a dashboard. A fleet
        # dying every twelve minutes passed every liveness check we had.
        description: any death, and falls specifically
        widget:
          type: customapi
          url: http://192.168.193.30:9200/mcai-skill-agents/_search
          method: POST
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          headers:
            Content-Type: application/json
          requestBody:
            size: 0
            query:
              bool:
                must:
                  - { term: { "skill.name": _death } }
                  - { range: { "@timestamp": { gte: now-1h } } }
            aggs:
              falls: { filter: { term: { "skill.fail_class": fall } } }
          mappings:
            - field: hits.total.value
              label: deaths
              format: number
            - field: aggregations.falls.doc_count
              label: falls
              format: number
    - Skill outcomes · 1h:
        description: what the fleet attempted and how it went
        widget:
          type: customapi
          url: http://192.168.193.30:9200/mcai-skill-agents/_search
          method: POST
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          headers:
            Content-Type: application/json
          requestBody:
            size: 0
            query: { range: { "@timestamp": { gte: now-1h } } }
            aggs:
              ok: { filter: { term: { "skill.status": success } } }
              moved: { sum: { field: skill.distance_moved } }
          mappings:
            - field: hits.total.value
              label: attempts
              format: number
            - field: aggregations.ok.doc_count
              label: succeeded
              format: number
            - field: aggregations.moved.value
              label: blocks moved
              format: number
    - Supervisor:
        description: death circuit breaker · last check
        widget:
          type: customapi
          url: http://192.168.193.30:9200/mcai-supervisor-lab/_search
          method: POST
          username: mcai_ro
          password: "{{HOMEPAGE_VAR_ES_RO}}"
          headers:
            Content-Type: application/json
          requestBody:
            size: 1
            sort: [{ "@timestamp": desc }]
            query: { term: { "supervisor.check": death_tripper } }
          mappings:
            - field: hits.hits.0._source.supervisor.tripped
              label: tripped
            - field: hits.hits.0._source.supervisor.falls_30m
              label: falls 30m
              format: number
            - field: hits.hits.0._source.supervisor.reason
              label: state

- Watch the bots:
    # prismarine-viewer: a live 3D view rendered around each bot -- terrain
    # updates as blocks change, and you can orbit the camera. The camera is
    # TETHERED to its bot and only loads chunks within that bot's view distance,
    # which is why there is one per bot rather than one for the world. Free
    # flight in a browser does not exist in this ecosystem: flying means
    # streaming arbitrary chunks on demand, which is what a Minecraft client is.
    - Scout01 · POV:
        href: http://192.168.193.40:3007
        description: live 3D, tethered to Scout01
        siteMonitor: http://192.168.193.40:3007
    - Scout02 · POV:
        href: http://192.168.193.40:3008
        description: live 3D, tethered to Scout02
        siteMonitor: http://192.168.193.40:3008
    - Miner01 · POV:
        href: http://192.168.193.40:3009
        description: live 3D, tethered to Miner01
        siteMonitor: http://192.168.193.40:3009
    - Gather01 · POV:
        href: http://192.168.193.40:3010
        description: live 3D, tethered to Gather01
        siteMonitor: http://192.168.193.40:3010
    - Gather02 · POV:
        href: http://192.168.193.40:3011
        description: live 3D, tethered to Gather02
        siteMonitor: http://192.168.193.40:3011
    - World map · squaremap:
        href: http://192.168.193.100:8080
        description: live 2D overview, all five bots — pick who to watch
        siteMonitor: http://192.168.193.100:8080

- Lab hosts:
