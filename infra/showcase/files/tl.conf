 "budget_s": 690,
 "reuse_page": true,
 "active_hours": 3,
 "follow_max_age_h": 6,
 "follow_max_age_h_why": "camdirector-01 (owner 2026-11-16): a follow camera (project4k) frames a project only while it placed a block within this many hours; with none it takes NO frame that slot (it used to frame the last project for days). A completed project record gets one final frame, then is dropped. 0 or null: no limit. A camera's own max_age_h wins.",
 "interval_min": 15,
 "idle_min": 120,
 "hires": 500,
 "sun": 1,
 "heavy_per_slot": 1,
 "smooth": "off",
 "pair_hourly": [
  "topdown"
 ],
 "director": {
  "on": true,
  "why": "camdirector-01 (owner 2026-11-16: 'cameras to show what the bots are working on'). While on, tl_showcase.py runs tl_director.py inside each 15-min slot: it reads the last tail_bytes of every bot's skill log, finds the live scenes (where the bots are, in three layers: surface, shallow, deep), shoots one camera per live SURFACE scene (frames/scene-<id>/) ahead of the fixed cameras, and writes every live scene to logs/scenes-slot.json (underground ones are drawn by tl_under.py). OFF SWITCH: set on to false (or remove this object) and the slot plans exactly the cameras it planned before; nothing else needs undoing. Every other key here is optional: the defaults are in tl_director.py DEFAULTS.",
  "tail_bytes": 2000000,
  "tail_bytes_why": "the cost bound: at most this much is read from the END of each bot log per slot, whatever the file's size",
  "window_min": 45,
  "hold_min": 30,
  "hold_min_why": "a scene stays live this long after its bots leave (same id if they come back), then closes",
  "max_surface": 3,
  "max_under": 2,
  "scene_budget_s": 90,
  "scene_budget_s_why": "the scene cameras' own ceiling per slot (estimated capture seconds), inside budget_s. They take the slots of the cameras below; raise it only with the capture CPU in view.",
  "slot_s": 360,
  "slot_s_why": "a slot that shoots a scene camera plans no more than this many seconds from its start (snapshot + render + every frame; measured 2026-11-16: a slot takes about 6 of every 15 minutes). The pair is always shot, then the scene cameras, then the fixed cameras while they fit; one that does not fit waits for the next slot. budget_s stays the hard limit.",
  "replaces": [
   "project4k"
  ],
  "replaces_why": "these cameras give up their slot whenever a scene camera is planned (a scene at the project is the same picture); in a slot with no surface scene they run as before",
  "idle_only": [
   "grounds",
   "patina",
   "iso"
  ],
  "idle_only_why": "while the director is on these cameras are shot at their idle_min only, never at interval_min: wide or static views that used an active slot every 15 to 30 min. They are not deleted.",
  "names": {
   "hall": "copper hall",
   "monument": "ziggurat"
  },
  "names_why": "project record name -> the words a caption uses ('2 bots building the copper hall')",
