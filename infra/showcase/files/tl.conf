   "ortho": 0,
   "mode": "perspective",
   "width": 1440,
   "height": 1440,
   "markers": [],
   "est_s": 40,
   "y": 69,
   "rotation": 0.7854,
   "angle": 0.6,
   "fov": 32,
   "min_distance": 40,
   "fit": 2.2
  },
  "scene_camera_why": "the fixed part of every scene camera (the event camera projectev's framing); the centre, the ground height and the distance come from the scene's box, as for a follow camera"
