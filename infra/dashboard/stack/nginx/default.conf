map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Grafana (Live uses a websocket).
    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # The owner's status report (scripts/host/statusreport.py, 4 times a day): files under ~/digest/statusreport on the
    # fleet host, served read-only by its mcai-dash-agent (latest.html at /status/, the archive beside it).
    location = /status { return 302 /status/; }
    location /status/ {
        proxy_pass http://10.0.0.31:9188/status/;
        add_header Cache-Control "no-store";
    }
    # Two showcase tables for statusreport.py on 10.0.0.31, which cannot reach 10.0.0.40:9188 (its ufw admits only this
    # host): the deploy log (releases.json) and the tripwire's newest verdict (trip.json). Read-only, exact names only.
    location ~ ^/agent/showcase/(releases|trip)\.json$ {
        proxy_pass http://10.0.0.40:9188/$1.json;
        add_header Cache-Control "no-store";
    }

    # The gallery page lives here; the videos themselves stay on the showcase host (10.0.0.40), where
    # infra/timelapse renders them, and mcai-dash-agent serves them (with Range) on :9188. Its ufw rule
    # admits only this host, so the browser always comes through this proxy.
    location /videos/ { index gallery.html; }
    location = /videos/index.json {
        proxy_pass http://10.0.0.40:9188/videos/index.json;
        add_header Cache-Control "no-store";
    }
    location /videos/thumbs/ {
        proxy_pass http://10.0.0.40:9188/videos/thumbs/;
        add_header Cache-Control "public, max-age=86400";
    }
    location /videos/files/ {
        proxy_pass http://10.0.0.40:9188/videos/files/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
