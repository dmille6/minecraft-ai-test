# Drop-in for /etc/systemd/system/mcbot@.service.d/ratelimit.conf
#
# StartLimitIntervalSec and StartLimitBurst belong in [Unit]. The vendor unit
# declares them under [Service], where systemd ignores them -- `systemctl show`
# reported StartLimitIntervalUSec=10s (the default) against a declared 300. And
# with RestartSec=10 a bot cannot restart ten times inside ten seconds, so the
# limit could never trip: a crash loop ran forever at one restart per ten
# seconds per bot, which for ten bots is a restart every second, indefinitely.
#
# 2026-08-10: EADDRINUSE on a viewer port put the fleet into exactly that loop.
# Nothing stopped it. The host reached load average 20.48, sshd could no longer
# complete a banner exchange, and the bots that had not crashed hung too --
# about fifteen minutes of total outage. Disk was 24% and 9GB of RAM were free
# throughout; the only exhausted resource was CPU, spent on restarting.
#
# With this, a bot that dies ten times in five minutes gives up and enters
# `failed`. An invisible infinite loop becomes a visible dead unit, which the
# fleet dashboard already reports as DEAD.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10
