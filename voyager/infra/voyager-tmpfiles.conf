# voyager-01: one socket dir per arm, writable by the proxy, readable only by that arm's group
d /run/voyager 0755 root root -
d /run/voyager/a 0750 voyager-proxy voyager-a -
d /run/voyager/b 0750 voyager-proxy voyager-b -
d /run/voyager/c 0750 voyager-proxy voyager-c -
d /run/voyager/ctl 0750 voyager-proxy voyager-ctl -
